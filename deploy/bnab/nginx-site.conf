# Installed to /etc/nginx/sites-available/bnab by setup-bnab-server.sh.
# HTTP-only until certbot issues TLS. After DNS is live, run:
#   sudo certbot --nginx -d bnab.bogza.ro
# which adds the :443 server block and certificates.
include /opt/bnab/nginx-active-upstream.conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    listen [::]:80;
    server_name bnab.bogza.ro;

    client_max_body_size 10m;

    location / {
        proxy_pass http://bnab_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
