name: Deploy BNAB

# Build .next on GitHub Actions, then zero-downtime promote to the INACTIVE
# blue/green slot (live stays up until nginx cutover).

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-bnab
  cancel-in-progress: true

jobs:
  deploy:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bnab

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Skip if BNAB unchanged
        working-directory: .
        id: gate
        run: |
          set -euo pipefail
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          if git diff --name-only "${SHA}^" "${SHA}" | grep -E '^(bnab/|deploy/bnab/|\.github/workflows/deploy-bnab\.yml)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "No BNAB paths in ${SHA} — skip deploy"
          fi

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: bnab/package-lock.json

      - name: Install
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: npm ci

      - name: Build
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        env:
          DATABASE_URL: "file:./ci.db"
          AUTH_SECRET: "ci-build-placeholder-secret-at-least-32-chars-long!!"
          AUTH_URL: "https://bnab.bogza.ro"
          AUTH_GOOGLE_ID: "ci-placeholder"
          AUTH_GOOGLE_SECRET: "ci-placeholder"
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          tar -czf .next-upload.tgz .next

      - name: Install sshpass
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        run: sudo apt-get update -y && sudo apt-get install -y sshpass

      - name: Promote build to VPS (inactive slot)
        if: steps.gate.outputs.run == 'true' || github.event_name == 'workflow_dispatch'
        working-directory: .
        env:
          SSHPASS: ${{ secrets.DEPLOY_SSH_PASSWORD }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
        run: |
          set -euo pipefail
          PORT="${DEPLOY_SSH_PORT:-22}"
          SSH=(sshpass -e ssh -p "$PORT"
            -o StrictHostKeyChecking=accept-new
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no
            -o ServerAliveInterval=30
            -o ServerAliveCountMax=120
            "${DEPLOY_USER}@${DEPLOY_HOST}")
          SCP=(sshpass -e scp -P "$PORT"
            -o StrictHostKeyChecking=accept-new
            -o PreferredAuthentications=password
            -o PubkeyAuthentication=no)

          # Stage targets — do NOT kill the live slot
          "${SSH[@]}" 'bash -s' <<'REMOTE'
          set -euo pipefail
          echo -n "active_slot="; cat /opt/bnab/active_slot
          mkdir -p /opt/bnab/shared/overlay
          chown -R deploy:deploy /opt/bnab/shared
          install -o deploy -g deploy -m 664 /dev/null /opt/bnab/shared/bnab-next-upload.tgz
          install -o deploy -g deploy -m 664 /dev/null /opt/bnab/shared/bnab-overlay.tgz
          install -o deploy -g deploy -m 755 /dev/null /opt/bnab/shared/remote-promote-inactive.sh
          REMOTE

          "${SCP[@]}" bnab/.next-upload.tgz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/bnab/shared/bnab-next-upload.tgz"
          "${SCP[@]}" deploy/bnab/remote-promote-inactive.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/bnab/shared/remote-promote-inactive.sh"

          # Overlay: schema/seed files for promote script + migrations/libs tarball
          mkdir -p /tmp/bnab-ov
          cp bnab/prisma/schema.prisma /tmp/bnab-ov/schema.prisma
          cp bnab/prisma/seed.ts /tmp/bnab-ov/seed.ts
          "${SCP[@]}" /tmp/bnab-ov/schema.prisma \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/bnab/shared/overlay/schema.prisma"
          "${SCP[@]}" /tmp/bnab-ov/seed.ts \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/bnab/shared/overlay/seed.ts"

          tar -czf /tmp/bnab-overlay.tgz \
            -C bnab \
            prisma/migrations \
            src/lib/receipt-ai \
            src/lib/plan-data.ts \
            src/lib/money.ts \
            src/lib/starter-categories.ts \
            src/lib/ing-import/default-rules.ts \
            src/lib/budget-engine/index.ts \
            2>/dev/null || tar -czf /tmp/bnab-overlay.tgz -C bnab prisma/migrations src/lib/receipt-ai

          "${SCP[@]}" /tmp/bnab-overlay.tgz \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/bnab/shared/bnab-overlay.tgz"

          if [ -d bnab/public ]; then
            tar -czf /tmp/bnab-public.tgz -C bnab/public \
              favicon.ico favicon-16.png favicon-32.png icon.svg \
              icon-192.png icon-512.png icon-192-maskable.png icon-512-maskable.png \
              apple-touch-icon.png manifest.webmanifest sw.js brand 2>/dev/null || true
            if [ -f /tmp/bnab-public.tgz ]; then
              "${SSH[@]}" 'install -o deploy -g deploy -m 664 /dev/null /opt/bnab/shared/bnab-public.tgz'
              "${SCP[@]}" /tmp/bnab-public.tgz \
                "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/bnab/shared/bnab-public.tgz"
            fi
          fi

          "${SSH[@]}" 'chmod +x /opt/bnab/shared/remote-promote-inactive.sh && bash /opt/bnab/shared/remote-promote-inactive.sh'
